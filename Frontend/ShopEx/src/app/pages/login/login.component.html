<div class="min-h-screen flex items-center justify-center bg-slate-50 px-4 py-10" dir="rtl">
  <div class="w-full max-w-md">
    <!-- Brand -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-primary to-blue-500 flex items-center justify-center text-white shadow-md">
        <span class="material-symbols-outlined text-[34px]">store</span>
      </div>
      <h1 class="mt-4 text-3xl font-black text-primary tracking-tight">ShopEx</h1>
      <p class="mt-1 text-sm text-slate-500">نظام إدارة المشتريات والمخازن والصيانة</p>
    </div>

    <!-- Card -->
    <form (ngSubmit)="onSubmit()" class="bg-light-surface rounded-2xl border border-outline shadow-sm p-7 space-y-5" autocomplete="on">
      <div>
        <h2 class="text-lg font-bold text-light-on-surface">تسجيل الدخول</h2>
        <p class="text-xs text-light-on-surface-variant mt-1">أدخل بيانات حسابك للمتابعة</p>
      </div>

      <div *ngIf="errorMessage" role="alert" class="p-3 bg-error-container text-on-error-container rounded-lg border border-error/20 flex items-start gap-2">
        <span class="material-symbols-outlined text-error text-[20px]">error</span>
        <span class="text-sm font-medium">{{ errorMessage }}</span>
      </div>

      <!-- Username -->
      <div>
        <label for="username" class="block text-xs font-semibold text-light-on-surface mb-1.5">اسم المستخدم</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-[20px]">person</span>
          <input id="username" type="text" name="username" [(ngModel)]="username"
                 autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="50" required autofocus
                 class="w-full pr-10 pl-3.5 py-2.5 border border-outline rounded-lg text-sm bg-light-surface focus:outline-none focus:border-primary transition-all"
                 dir="ltr" style="text-align: right">
        </div>
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-xs font-semibold text-light-on-surface mb-1.5">كلمة المرور</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-[20px]">lock</span>
          <input id="password" [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password"
                 autocomplete="current-password" maxlength="100" required
                 class="w-full pr-10 pl-11 py-2.5 border border-outline rounded-lg text-sm bg-light-surface focus:outline-none focus:border-primary transition-all"
                 dir="ltr" style="text-align: right">
          <button type="button" (click)="showPassword = !showPassword"
                  class="absolute left-2 top-1/2 -translate-y-1/2 p-1.5 text-slate-400 hover:text-primary rounded-md transition-colors"
                  [attr.aria-label]="showPassword ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور'">
            <span class="material-symbols-outlined text-[20px]">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
      </div>

      <button type="submit" [disabled]="submitting"
              class="w-full inline-flex items-center justify-center gap-2 px-6 py-2.5 bg-primary text-on-primary font-bold rounded-lg hover:bg-primary/90 disabled:opacity-60 shadow transition-all text-sm">
        <span *ngIf="submitting" class="inline-block animate-spin w-4 h-4 border-2 border-white border-t-transparent rounded-full"></span>
        <span *ngIf="!submitting" class="material-symbols-outlined text-[20px]">login</span>
        <span>{{ submitting ? 'جاري الدخول...' : 'دخول' }}</span>
      </button>
    </form>
  </div>
</div>
